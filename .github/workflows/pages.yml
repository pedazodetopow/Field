name: Validar y publicar Field

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Capturas financieras de escritorio y móvil
        run: node scripts/capture-finance.mjs
        env:
          FIELD_SCREENSHOT_DIR: test-results/capturas
      - name: Conservar capturas verificables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-finanzas
          path: test-results/capturas/
          retention-days: 14
      - name: Mostrar los errores de navegador en el resumen de Actions
        if: failure()
        run: node scripts/report-test-errors.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados-navegador
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verificar la configuración de Pages
        uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
